# Local single-node Kubernetes cluster for development (kind = Kubernetes IN Docker).
#   kind create cluster --config k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shop
nodes:
  - role: control-plane
    # The ingress controller listens on NodePort 30080 inside the node; this maps it
    # to http://127.0.0.1:18080 on the host (localhost only).
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: "127.0.0.1"
        protocol: TCP
