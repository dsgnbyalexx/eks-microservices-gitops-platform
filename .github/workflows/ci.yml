# Continuous Integration: runs on every push to main and on every pull request.
# No cloud account is used: the end-to-end job creates a throwaway Kubernetes
# cluster (kind) on the GitHub runner, deploys the Helm chart and tests it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  SERVICES: auth catalog orders payments notifications

jobs:
  python:
    name: Python · lint & unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Unit tests
        run: pytest --cov --cov-report=term-missing

  images:
    name: Image · ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [auth, catalog, orders, payments, notifications]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg SERVICE="${{ matrix.service }}" -t "shop/${{ matrix.service }}:ci" .
      - name: Vulnerability summary (all severities, informational)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --quiet --scanners vuln "shop/${{ matrix.service }}:ci"
      # Fails the build on HIGH/CRITICAL vulnerabilities that have a fix available.
      - name: Vulnerability gate
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          "shop/${{ matrix.service }}:ci"

  helm:
    name: Helm · lint & schema validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Lint (default and kind values)
        run: |
          helm lint helm/shop --strict
          helm lint helm/shop --strict -f helm/shop/values-kind.yaml
      - name: Validate rendered manifests against Kubernetes 1.37 schemas
        run: |
          helm template shop helm/shop -n shop > rendered.yaml
          docker run --rm -v "$PWD:/w:ro" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.37.0 /w/rendered.yaml

  e2e:
    name: End-to-end · kind + Helm + smoke + rollout
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [python, helm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the smoke-test client
        run: pip install requests==2.34.2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          config: k8s/kind-config.yaml
          cluster_name: shop

      - name: Install the Traefik ingress controller
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm upgrade --install traefik traefik/traefik --version 42.1.3 \
            -n traefik --create-namespace -f k8s/traefik-values.yaml --wait --timeout 5m

      - name: Build images and load them into kind
        run: |
          images=()
          for s in $SERVICES; do
            docker build --build-arg SERVICE="$s" -t "shop/$s:local" .
            images+=("shop/$s:local")
          done
          kind load docker-image --name shop "${images[@]}"

      # Fresh random secrets for every run; never stored anywhere.
      - name: Create namespace and secret
        run: |
          kubectl apply -f k8s/namespace.yaml
          AUTH=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          PW=$(python -c "import secrets; print(secrets.token_urlsafe(18))")
          echo "::add-mask::$AUTH"
          echo "::add-mask::$PW"
          echo "DEMO_PASSWORD=$PW" >> "$GITHUB_ENV"
          kubectl -n shop create secret generic shop-secrets \
            --from-literal=AUTH_SECRET_KEY="$AUTH" --from-literal=DEMO_PASSWORD="$PW"

      # Default values: 2 replicas of every service (the runner has enough memory).
      - name: Deploy the Helm chart
        run: |
          helm upgrade --install shop helm/shop -n shop --wait --timeout 5m
          kubectl -n shop get pods -o wide

      - name: Smoke test through the Ingress
        env:
          SMOKE_BASE_URL: http://127.0.0.1:18080
        run: python scripts/smoke_test.py

      - name: Zero-downtime rolling update under traffic
        env:
          PYTHON: python
        run: |
          result=$(bash scripts/rollout_experiment.sh 5 | tail -1)
          echo "$result"
          echo "$result" | grep -q "failed: 0 " || { echo "::error::requests failed during the rolling update"; exit 1; }
          echo "$result" | grep -q "| VALID$" || { echo "::error::experiment invalid (ingress controller restarted)"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n shop get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n shop describe pods | tail -120 || true
          for s in $SERVICES; do kubectl -n shop logs "deploy/$s" --tail=30 || true; done
          kubectl -n traefik logs deploy/traefik --tail=40 || true
