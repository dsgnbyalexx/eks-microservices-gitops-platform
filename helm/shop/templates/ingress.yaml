{{- /*
Standard Kubernetes Ingress: portable across ingress controllers (Traefik on kind,
AWS Load Balancer Controller on EKS). Only paths listed in ingressPaths are routed;
payments and every /internal/* path are unreachable from outside.
*/ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- range $svc.ingressPaths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
          {{- end }}
          {{- end }}
{{- end }}
