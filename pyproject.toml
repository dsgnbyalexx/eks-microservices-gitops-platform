[project]
name = "eks-microservices-gitops-platform"
version = "0.1.0"
description = "Five Flask microservices packaged for Kubernetes"
requires-python = ">=3.14"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["services", "tests"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["services"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["services", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["common", "auth", "catalog", "orders", "payments", "notifications", "helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101", "S105", "S106"]
