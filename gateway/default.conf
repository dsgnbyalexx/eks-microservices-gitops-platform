# Local API gateway for Docker Compose. In Kubernetes, an Ingress does this job.
# Only public routes are exposed: payments is internal (only orders calls it),
# and notifications are read-only from outside.

server {
    listen 8080;
    client_max_body_size 64k;

    # Pass the client's request id through, or let nginx generate one.
    set $req_id $http_x_request_id;
    if ($req_id = "") { set $req_id $request_id; }
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    location /auth/          { proxy_pass http://auth:8000; }
    location /catalog/       { proxy_pass http://catalog:8000; }
    location /orders         { proxy_pass http://orders:8000; }

    location = /notifications {
        limit_except GET { deny all; }
        proxy_pass http://notifications:8000;
    }

    location / {
        default_type application/json;
        return 404 '{"error": "not found"}';
    }
}
